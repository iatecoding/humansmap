  <line x1="16" y1="12.5" x2="22.5" y2="17" stroke="#1b4d8e" stroke-width="0.9" stroke-opacity="0.45"/>
  <line x1="9.5" y1="21" x2="15" y2="23.5" stroke="#bf6b28" stroke-width="0.9" stroke-opacity="0.45"/>
  <line x1="22.5" y1="21" x2="17" y2="23.5" stroke="#8a8278" stroke-width="0.9" stroke-opacity="0.45"/>
  <!-- Top node: accent blue (hub / person) -->
