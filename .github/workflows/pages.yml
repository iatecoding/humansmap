name: Pages showcase

# Publishes the static, backend-free showcase in `showcase/` to GitHub Pages.
# It is a reduced preview of the site (search, entity pages, graph) built from
# the small demo dataset — not the full application.
#
# One-time setup: in the repository, Settings → Pages → Build and deployment →
# Source: "GitHub Actions". After that this workflow deploys on every push to
# main (or manually via "Run workflow").

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-progress deployment mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies (for the vendored graph libraries)
        working-directory: frontend
        run: npm ci

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build the static showcase
        run: python scripts/build_showcase.py _site

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
