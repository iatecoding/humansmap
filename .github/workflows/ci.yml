name: CI

on:
  push:
  pull_request:
    branches: [master]

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend
      ARANGO_HOST: localhost
      ARANGO_PORT: 8529
      ARANGO_DB: _system
      ARANGO_USERNAME: root
      ARANGO_PASSWORD: ci-password
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_URL: redis://localhost:6379/0
      ALLOWED_ORIGINS: http://localhost:3000
    services:
      arangodb:
        image: arangodb:3.11
        env:
          ARANGO_ROOT_PASSWORD: ci-password
        ports:
          - 8529:8529
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8529/_api/version || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Seed CI database
        run: python backend/scripts/seed_ci_data.py

      - name: Run pytest
        run: pytest backend/tests/ -v

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Run Vitest tests
        working-directory: frontend
        run: npx vitest run
